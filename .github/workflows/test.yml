name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Install wheel in a clean venv and build the example
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd example && /tmp/clean/bin/mkdocs build --strict

  min-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . "mkdocs==1.5.0" "pydbml==1.0.10" pytest
      - run: pytest tests --ignore=tests/e2e -q

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ --ignore=tests/e2e -v --cov --cov-report=term-missing

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and e2e deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[e2e]"

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run browser tests
        run: pytest tests/e2e -v --tracing retain-on-failure --screenshot only-on-failure --output test-results

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
